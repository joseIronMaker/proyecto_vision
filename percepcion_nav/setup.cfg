[develop]
script_dir=$base/lib/percepcion_nav

[install]
install_scripts=$base/lib/percepcion_nav

[build_scripts]
# Los ejecutables usan el Python del entorno virtual activo (donde está ultralytics),
# no /usr/bin/python3 (research R6).
executable = /usr/bin/env python3

[tool:pytest]
# Permite ejecutar las pruebas sin ROS desde la raíz del repositorio:
# `python -m pytest percepcion_nav/test/test_geometry.py` importa percepcion_nav/percepcion_nav/.
pythonpath = .
